<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

table {
    width: 70%;
    margin: auto;
    border-collapse: collapse;
    background-color: white;
}

th {
    background-color: #333;
    color: white;
    padding: 12px;
}

td {
    padding: 12px;
    text-align: center;
}

th, td {
    border: 1px solid black;
}

tr:hover {
    background-color: #f1f1f1;
}</style>
  </head>
  <body>
    <table>
      <h1>using table tags</h1>
      <thead>
        <tr>
          <th>Name</th>
          <th>job</th>
          <th>salary</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Rohan</td>
          <td>software engineer</td>
          <td>$2000000</td>
        </tr>
        <tr>
          <td>radhika</td>
          <td>AI engineer</td>
          <td>$2000000</td>
        </tr>
        <tr>
          <td>sohit</td>
          <td>ml engineer</td>
          <td>$20000</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
