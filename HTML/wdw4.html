<!DOCTYPE html>
<html>
<head>
    <title>New User Registration</title>
</head>
<body>

    <h2>Create New Account</h2>

    <form>

        <label>Username:</label><br>
        <input type="text" name="username" required>
        <br><br>

        <br><br>

        <label>Password:</label><br>

        <h3>Security Questions</h3>

        </select>
