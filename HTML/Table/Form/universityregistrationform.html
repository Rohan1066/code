<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>university registration form</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register </p>
    <hr>
    <h2>Personal Details</h2>
    <br> <br>
    <level for="first name">First Name </level>
    <input type="text" id="first name" placeholder="name" required>
    <br><br>
    <level for="surname">Last Name </level>
    <input type="text" id="surname" placeholder="surname">
    <br><br>
    <level for="Date of birth">Date of birth </level>
    <input type="date" id="date of birth" placeholder="DOB">
    <br><br>
    <h3>Gender</h3>
    <br>
    <lebel for="male">Male</lebel>
    <input type="radio" name="male" id="male">
    <br>
    <lebel for="female">female</lebel>
    <input type="radio" name="female" id="female">
    <br>
    <lebel for="other">other</lebel>
    <input type="radio" name="other" id="other">
    <br><br>
    <h3>upload your photo</h3>
    <input type="file" name="file">
    <br>
    <hr>
    <h2>Contact Information</h2>
    <br><br>
    <lebel>Email Address :</lebel>
    <input type="email" name="emil" placeholder="email">
    <br>
     <lebel>Phone Number :</lebel>
    <input type="tel" name="tel" placeholder="number">
    <br><br>
     <lebel>Address :</lebel>
    <textarea name="Address" rows="5" cols="10"></textarea>
    <hr> 
    <h2>Academic Information</h2>
    <br>
    <lebel for="course">Select Your Course</lebel>
    <select name="course" id="course">
    <option value="CSE">CSE</option>
    <option value="ME">ME</option>
    <option value="EE">EE</option>
    </select>
    <br></br>
    <button >SUBMIT</button>
</body>
</html>
